# Android debug + release builds and unit tests on every push to main and every pull request.
# The cloud sessions that write Leaf cannot reach Google Maven, so this is the build gate.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Debug and release KSP both write app/schemas; run in parallel on a fresh checkout they race and
      # one reads the other's half-written JSON. Generating it once first leaves the second with nothing to write.
      - name: room schema
        run: |
          ./gradlew --console=plain kspDebugKotlin
          find app/schemas -name '*.json' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
      - name: build and unit tests
        run: ./gradlew --console=plain assembleDebug testDebugUnitTest assembleRelease
      - name: test counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      print("FAILED {}.{}".format(case.get("classname"), case.get("name")))
                      print("\n".join((problem.text or "").splitlines()[:25]))
          print("unit tests: {tests} run, {failures} failed, {errors} errors, {skipped} skipped".format(**totals))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-release-apk-debug-signed
          path: app/build/outputs/apk/release/*.apk
      # Robolectric pictures of the editor (EditorScreenshots), for looking at UI without a device.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn
